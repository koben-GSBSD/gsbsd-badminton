  <script>
    // SESSION GUARD — jalankan sebelum DOM dimuat
    // 1 akun sama dipakai untuk HOSTMABAR & CUANMABAR — sesi (hm_session) dibuat saat
    // login di loginpage.html, lalu dipakai lagi di sini tanpa login ulang. Akses ke
    // halaman ini hanya lewat tombol "Akses CUANMABAR" di dashboard.html (sudah
    // dibatasi per paket di sana). login-cuanmabar.html (versi lama) sudah tidak dipakai.
    (function() {
      try {
        var raw = localStorage.getItem('hm_session');
        if (!raw) { window.location.replace('loginpage.html'); return; }
        var s = JSON.parse(raw);
        if (!s || !s.loginAt) { window.location.replace('loginpage.html'); return; }
        if (s.expiresAt && Date.now() > s.expiresAt) {
          localStorage.removeItem('hm_session');
          localStorage.removeItem('hm_komunitas');
          window.location.replace('loginpage.html'); return;
        }
      } catch(e) { window.location.replace('loginpage.html'); }
    })();
  </script>

  <script>
    // --- 1. CONFIG DATA AWAL BERSIH (EMPTY STATE READY FOR USER) ---
    const defaultKas = [];
    const defaultMembers = [];
    const defaultInv = [];

    // ── SUPABASE CLIENT ────────────────────────────────────────────────────
    const SUPA_URL = 'https://pxfpskzwkfpxslsvqbpz.supabase.co';
    const SUPA_KEY = 'sb_publishable_F0VfuDGusu23CJY8PIqMIg_AgyITitp';
    const db = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false
      }
    });

    // ── DATA STATE ──────────────────────────────────────────────────────────
    // localStorage key HARUS per-user agar data tidak tercampur antar komunitas
    // Key diset setelah _userId diketahui di loadCloudData()
    let transactions = [];  // init kosong — akan diisi dari Supabase
    let members      = [];
    let inventoryTxs = [];
    let _userId      = null;
    let _isSyncing   = false;
    let _lsKey       = { kas: 'cm_kas', mem: 'cm_members', inv: 'cm_inv' }; // default, override per user

    let activeTab = 'dashboard';
    let editingId = null;

    // ── SYNC STATUS UI ───────────────────────────────────────────────────────
    function showSyncStatus(msg, color) {
      const el = document.getElementById('sync-status');
      if (!el) return;
      el.textContent = msg;
      el.style.color = color || '#64748b';
      if (color === '#22c55e') setTimeout(() => { el.style.opacity = '0.5'; }, 2500);
      else el.style.opacity = '1';
    }

    // ── LOAD DATA DARI SUPABASE + CEK LANGGANAN ────────────────────────────
    async function loadCloudData() {
      try {
        showSyncStatus('⏳ Memuat...', '#f59e0b');

        // Coba ambil session dari Supabase Auth
        let { data: { session } } = await db.auth.getSession();

        // Fallback: jika session null, coba refresh token
        if (!session) {
          const { data: refreshed } = await db.auth.refreshSession();
          session = refreshed?.session || null;
        }

        if (!session) {
          showSyncStatus('⚠️ Sesi habis — login ulang', '#ef4444');
          setTimeout(() => {
            localStorage.removeItem('hm_session');
            localStorage.removeItem('hm_komunitas');
            window.location.href = 'loginpage.html';
          }, 2000);
          return;
        }
        _userId = session.user.id;

        // ── Set localStorage key per-user (namespace isolation) ───────────
        // Setiap komunitas punya key sendiri → tidak bisa tercampur
        _lsKey = {
          kas: 'cm_kas_'  + _userId,
          mem: 'cm_mem_'  + _userId,
          inv: 'cm_inv_'  + _userId
        };

        // ── 1. Cek status langganan dari profiles ──────────────────────────
        const { data: prof } = await db
          .from('profiles')
          .select('username_komunitas, paket_langganan, tanggal_aktif, tanggal_kedaluarsa')
          .eq('id', _userId)
          .single();

        if (prof) {
          renderSubscriptionBadge(prof);
          checkExpiryReminder(prof);
          // Cek expired — data TETAP ADA, hanya akses diblokir
          if (prof.tanggal_kedaluarsa) {
            const exp = new Date(prof.tanggal_kedaluarsa);
            exp.setHours(23, 59, 59, 999);
            if (Date.now() > exp.getTime()) {
              showSyncStatus('⛔ Akses berakhir', '#ef4444');
              showExpiredBanner(prof);
              updateUI(); return; // stop di sini, data tidak di-load ke UI
            }
          }
        }

        // ── 2. Load data keuangan ──────────────────────────────────────────
        const { data, error } = await db
          .from('cuanmabar_data')
          .select('data_type, payload')
          .eq('user_id', _userId);

        if (error) throw error;

        if (data && data.length > 0) {
          // Data ada di cloud — pakai data cloud, simpan ke localStorage user ini
          data.forEach(row => {
            if (row.data_type === 'kas') {
              transactions = row.payload;
              localStorage.setItem(_lsKey.kas, JSON.stringify(transactions));
            }
            if (row.data_type === 'members') {
              members = row.payload;
              localStorage.setItem(_lsKey.mem, JSON.stringify(members));
            }
            if (row.data_type === 'inv') {
              inventoryTxs = row.payload;
              localStorage.setItem(_lsKey.inv, JSON.stringify(inventoryTxs));
            }
          });
          showSyncStatus('✅ Data dimuat', '#22c55e');
        } else {
          // Akun baru — coba load dari localStorage user ini (offline cache)
          const lsKas = localStorage.getItem(_lsKey.kas);
          const lsMem = localStorage.getItem(_lsKey.mem);
          const lsInv = localStorage.getItem(_lsKey.inv);
          if (lsKas) transactions  = JSON.parse(lsKas);
          if (lsMem) members       = JSON.parse(lsMem);
          if (lsInv) inventoryTxs  = JSON.parse(lsInv);
          showSyncStatus('✅ Data siap', '#22c55e');
          // Inisialisasi baris di Supabase (payload kosong) agar upsert berikutnya bekerja
          await saveCloud();
        }
        updateUI();
      } catch(e) {
        console.error('loadCloudData:', e.message);
        // Offline — load dari localStorage user ini jika ada
        if (_lsKey.kas !== 'cm_kas') { // userId sudah diketahui
          const lsKas = localStorage.getItem(_lsKey.kas);
          const lsMem = localStorage.getItem(_lsKey.mem);
          const lsInv = localStorage.getItem(_lsKey.inv);
          if (lsKas) transactions  = JSON.parse(lsKas);
          if (lsMem) members       = JSON.parse(lsMem);
          if (lsInv) inventoryTxs  = JSON.parse(lsInv);
        }
        showSyncStatus('📶 Offline — data lokal', '#f59e0b');
        updateUI();
      }
    }

    // ── BADGE LANGGANAN DI HEADER ────────────────────────────────────────────
    function renderSubscriptionBadge(prof) {
      const el = document.getElementById('subs-badge');
      if (!el || !prof) return;
      const paket = (prof.paket_langganan || '').toUpperCase();
      const exp   = prof.tanggal_kedaluarsa
        ? new Date(prof.tanggal_kedaluarsa).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'})
        : '—';
      const aktif = prof.tanggal_aktif
        ? new Date(prof.tanggal_aktif).toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'})
        : '—';
      const isExpired = prof.tanggal_kedaluarsa && Date.now() > new Date(prof.tanggal_kedaluarsa).getTime();
      el.innerHTML = `
        <span style="font-size:11px;font-weight:700;font-family:'Nunito',sans-serif;
                     padding:3px 10px;border-radius:20px;
                     background:${isExpired ? 'rgba(239,68,68,.12)' : 'rgba(101,163,13,.12)'};
                     border:1.5px solid ${isExpired ? '#ef4444' : 'rgba(101,163,13,.5)'};
                     color:${isExpired ? '#dc2626' : '#4d7c0f'};">
          ${isExpired ? '⛔' : '⚡'} ${paket || 'BASIC'}
        </span>
        <span style="font-size:10px;color:#64748b;margin-left:6px;">
          Aktif: ${aktif} · Hingga: ${exp}
        </span>`;
    }

    // ── POPUP PENGINGAT PERPANJANGAN — muncul H-7, maksimal 1x per hari ──────
    function checkExpiryReminder(prof) {
      if (!prof || !prof.tanggal_kedaluarsa || !_userId) return;
      const exp = new Date(prof.tanggal_kedaluarsa);
      exp.setHours(23, 59, 59, 999);
      const daysLeft = Math.ceil((exp.getTime() - Date.now()) / 86400000);
      // Hanya untuk yang masih aktif tapi akan berakhir dalam 7 hari (bukan yang sudah expired —
      // itu sudah ditangani showExpiredBanner secara terpisah dan lebih tegas)
      if (daysLeft < 0 || daysLeft > 7) return;

      const today = new Date().toISOString().split('T')[0];
      const flagKey = 'cm_expiryPopupShown_' + _userId;
      if (localStorage.getItem(flagKey) === today) return; // sudah tampil hari ini

      localStorage.setItem(flagKey, today);
      const expStr = exp.toLocaleDateString('id-ID', {day:'2-digit',month:'long',year:'numeric'});
      const hariText = daysLeft === 0 ? 'hari ini' : daysLeft === 1 ? 'besok' : `${daysLeft} hari lagi`;

      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-white w-full max-w-sm rounded-2xl p-6 border border-amber-200 shadow-2xl modal-enter text-center">
            <div class="text-4xl mb-3">⏰</div>
            <h3 class="text-lg font-bold text-slate-800 mb-1">Langganan Segera Berakhir</h3>
            <p class="text-sm text-slate-500 mb-4">
              Akses CUANMABAR kamu berakhir <strong class="text-amber-600">${hariText}</strong> (${expStr}).
              Perpanjang sekarang supaya pencatatan kas tidak terhenti.
            </p>
            <a href="https://wa.me/6281234567890?text=Halo+HOSTMABAR%2C+saya+ingin+perpanjang+CUANMABAR"
               target="_blank" rel="noopener"
               class="block w-full mb-2 p-3 rounded-lg font-bold text-sm text-white text-center"
               style="background:linear-gradient(135deg,#84cc16,#4d7c0f)">
              💬 Perpanjang via WhatsApp
            </a>
            <button onclick="closeModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 p-2.5 rounded-lg text-sm font-medium transition-colors">Nanti saja</button>
          </div>
        </div>`;
      if (window.lucide) lucide.createIcons();
    }

    // ── BANNER EXPIRED (akses diblokir, data aman) ───────────────────────────
    function showExpiredBanner(prof) {
      // Sembunyikan konten utama
      const appContent = document.getElementById('app-content');
      if (appContent) appContent.style.display = 'none';
      const nav = document.querySelector('nav');
      if (nav) nav.style.display = 'none';

      // Tampilkan banner
      let banner = document.getElementById('expired-banner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'expired-banner';
        document.body.appendChild(banner);
      }
      const exp = prof.tanggal_kedaluarsa
        ? new Date(prof.tanggal_kedaluarsa).toLocaleDateString('id-ID', {day:'2-digit',month:'long',year:'numeric'})
        : '—';
      banner.innerHTML = `
        <div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;">
          <div style="background:#ffffff;border:2px solid #FECACA;border-radius:24px;box-shadow:0 8px 32px rgba(30,41,59,.08);
                      padding:36px 28px;max-width:400px;width:100%;text-align:center;">
            <div style="font-size:52px;margin-bottom:12px;">⛔</div>
            <div style="font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;
                        color:#1E293B;margin-bottom:8px;">Akses Berakhir</div>
            <div style="font-size:13px;color:#475569;margin-bottom:6px;line-height:1.6;">
              Langganan <strong style="color:#4d7c0f;">${(prof.paket_langganan||'BASIC').toUpperCase()}</strong>
              kamu berakhir pada <strong style="color:#dc2626;">${exp}</strong>.
            </div>
            <div style="font-size:12px;color:#64748b;margin-bottom:24px;line-height:1.6;">
              📦 Data keuangan kamu <strong style="color:#16a34a;">tetap tersimpan</strong> dan aman.<br>
              Perpanjang akses untuk melanjutkan pencatatan.
            </div>
            <a href="https://wa.me/6281234567890?text=Halo+HOSTMABAR%2C+saya+ingin+perpanjang+CUANMABAR"
               target="_blank"
               style="display:block;padding:13px 24px;background:linear-gradient(135deg,#84cc16,#4d7c0f);
                      color:#fff;border-radius:12px;font-family:'Nunito',sans-serif;font-size:14px;
                      font-weight:800;text-decoration:none;margin-bottom:12px;
                      box-shadow:0 4px 16px rgba(101,163,13,.35);">
              💬 Perpanjang via WhatsApp
            </a>
            <button onclick="handleLogout()"
                    style="background:none;border:none;color:#64748b;font-size:12px;
                           cursor:pointer;font-family:'Nunito',sans-serif;">
              Logout
            </button>
          </div>
        </div>`;
    }

    // ── SIMPAN KE SUPABASE (upsert) ──────────────────────────────────────────
    async function saveCloud() {
      if (!_userId || _isSyncing) return;
      _isSyncing = true;
      showSyncStatus('💾 Menyimpan...', '#f59e0b');
      try {
        const now = new Date().toISOString();
        const rows = [
          { user_id: _userId, data_type: 'kas',     payload: transactions,  updated_at: now },
          { user_id: _userId, data_type: 'members', payload: members,       updated_at: now },
          { user_id: _userId, data_type: 'inv',     payload: inventoryTxs, updated_at: now },
        ];
        const { error } = await db
          .from('cuanmabar_data')
          .upsert(rows, { onConflict: 'user_id,data_type' });
        if (error) throw error;
        showSyncStatus('✅ Tersimpan online', '#22c55e');
      } catch(e) {
        console.error('saveCloud error:', e.message, e);
        showSyncStatus('⚠️ Gagal sync — ' + (e.message || 'cek koneksi'), '#ef4444');
      } finally {
        _isSyncing = false;
      }
    }

    // --- 2. HELPERS ---
    const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
    const saveLocal = () => {
      // Simpan ke localStorage user-specific (tidak bisa tercampur antar user)
      localStorage.setItem(_lsKey.kas, JSON.stringify(transactions));
      localStorage.setItem(_lsKey.mem, JSON.stringify(members));
      localStorage.setItem(_lsKey.inv, JSON.stringify(inventoryTxs));
      // Sync ke Supabase
      saveCloud();
    };

    const updateUI = () => {
      renderActiveTab();
      renderPrintView();
      updateNavStyles();
      lucide.createIcons();
    };

    function switchTab(tab) {
      activeTab = tab;
      updateUI();
    }

    function updateNavStyles() {
      ['dashboard', 'kas', 'iuran', 'inventory'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if(t === activeTab) {
          btn.classList.add('text-lime-600', 'bg-lime-50'); btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('text-lime-600', 'bg-lime-50'); btn.classList.add('text-slate-400');
        }
      });
    }

    function handleLogout() {
      const m = document.getElementById('logoutModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }
    function tutupLogoutModal() {
      const m = document.getElementById('logoutModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function saveKas(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = {
        date: fd.get('date'), type: fd.get('type'), category: fd.get('category'),
        amount: parseInt(fd.get('amount')), description: fd.get('description')
      };
      if (editingId) {
        transactions = transactions.map(t => t.id === editingId ? { ...t, ...data } : t);
      } else {
        transactions.unshift({ id: Date.now(), ...data });
        transactions.sort((a,b) => new Date(b.date) - new Date(a.date));
      }
      saveLocal(); closeModal(); updateUI();
    }

    function saveInv(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const custom = fd.get('customItemName');
      const data = {
        date: fd.get('date'), type: fd.get('type'),
        itemName: custom ? custom : fd.get('itemName'),
        qty: parseInt(fd.get('qty')), description: fd.get('description')
      };
      if (editingId) {
        inventoryTxs = inventoryTxs.map(t => t.id === editingId ? { ...t, ...data } : t);
      } else {
        inventoryTxs.unshift({ id: Date.now(), ...data });
        inventoryTxs.sort((a,b) => new Date(b.date) - new Date(a.date));
      }
      saveLocal(); closeModal(); updateUI();
    }
    function deleteInv(id) {
      if(confirm("Hapus log ini?")) { inventoryTxs = inventoryTxs.filter(t => t.id !== id); saveLocal(); updateUI(); }
    }


    // ── HISTORI PER BULAN ────────────────────────────────────────────────────
    function openHistoriModal() {
      // Kumpulkan semua bulan unik dari data transaksi
      const monthMap = {};
      transactions.forEach(tx => {
        if (!tx.date) return;
        const [y, m] = tx.date.split('-');
        const key = `${y}-${m}`;
        if (!monthMap[key]) monthMap[key] = { year: y, month: m, txs: [] };
        monthMap[key].txs.push(tx);
      });

      // Urutkan bulan dari terbaru
      const months = Object.values(monthMap).sort((a, b) =>
        `${b.year}-${b.month}`.localeCompare(`${a.year}-${a.month}`)
      );

      const BULAN = ['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
      const BULAN_FULL = ['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

      if (months.length === 0) {
        document.getElementById('modal-container').innerHTML = `
          <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
            <div class="bg-white w-full max-w-sm rounded-2xl p-6 border border-slate-200 shadow-2xl modal-enter text-center">
              <div class="text-4xl mb-3">📅</div>
              <p class="text-slate-800 font-bold mb-1">Belum Ada Histori</p>
              <p class="text-slate-500 text-sm mb-4">Catat transaksi pertama untuk mulai melihat histori.</p>
              <button onclick="closeModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-6 py-2 rounded-lg text-sm font-semibold transition-colors">Tutup</button>
            </div>
          </div>`;
        if (window.lucide) lucide.createIcons();
        return;
      }

      // Grid kalender bulan
      const gridItems = months.map(m => {
        const totalIn  = m.txs.filter(t => t.type === 'in').reduce((s,t) => s + t.amount, 0);
        const totalOut = m.txs.filter(t => t.type === 'out').reduce((s,t) => s + t.amount, 0);
        const net = totalIn - totalOut;
        return `
          <button onclick="openHistoriDetail('${m.year}','${m.month}')"
            class="bg-slate-50 hover:bg-lime-50 border border-slate-200 hover:border-lime-300
                   rounded-xl p-3 text-left transition-all">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${m.year}</span>
              <span class="text-xs text-slate-400">${m.txs.length} txn</span>
            </div>
            <div class="text-slate-800 font-bold text-lg leading-tight">${BULAN_FULL[parseInt(m.month)]}</div>
            <div class="mt-2 text-xs ${net >= 0 ? 'text-emerald-600' : 'text-red-600'} font-semibold">
              ${net >= 0 ? '+' : ''}${formatRp(net)}
            </div>
          </button>`;
      }).join('');

      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
          <div class="bg-white w-full max-w-sm rounded-2xl border border-slate-200 shadow-2xl modal-enter overflow-hidden">
            <div class="flex justify-between items-center px-5 py-4 border-b border-slate-200">
              <div>
                <h3 class="text-slate-800 font-bold text-base">📅 Histori Kas</h3>
                <p class="text-slate-400 text-xs mt-0.5">Pilih bulan untuk melihat transaksi</p>
              </div>
              <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">✕</button>
            </div>
            <div class="p-4 overflow-y-auto max-h-[70vh]">
              <div class="grid grid-cols-2 gap-2.5">
                ${gridItems}
              </div>
            </div>
          </div>
        </div>`;
      if (window.lucide) lucide.createIcons();
    }

    function openHistoriDetail(year, month) {
      const BULAN_FULL = ['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      const label = `${BULAN_FULL[parseInt(month)]} ${year}`;
      const monthKey = `${year}-${month}`;

      const txs = transactions
        .filter(tx => tx.date && tx.date.startsWith(monthKey))
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      const totalIn  = txs.filter(t => t.type === 'in').reduce((s,t) => s + t.amount, 0);
      const totalOut = txs.filter(t => t.type === 'out').reduce((s,t) => s + t.amount, 0);
      const net = totalIn - totalOut;

      const txRows = txs.length === 0
        ? `<p class="text-slate-400 text-sm text-center py-6">Tidak ada transaksi bulan ini.</p>`
        : txs.map(tx => `
            <div class="bg-slate-50 rounded-lg p-3 border border-slate-200">
              <div class="flex justify-between items-start">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-1">
                    <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-200 text-slate-600 capitalize">${tx.category}</span>
                    <span class="text-xs text-slate-400">${tx.date}</span>
                  </div>
                  <p class="text-slate-700 text-sm truncate">${tx.description}</p>
                </div>
                <div class="font-bold text-sm ml-3 whitespace-nowrap ${tx.type === 'in' ? 'text-emerald-600' : 'text-red-600'}">
                  ${tx.type === 'in' ? '+' : '-'}${formatRp(tx.amount)}
                </div>
              </div>
            </div>`).join('');

      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="if(event.target===this)openHistoriModal()">
          <div class="bg-white w-full max-w-sm rounded-2xl border border-slate-200 shadow-2xl modal-enter overflow-hidden">
            <div class="flex justify-between items-center px-5 py-4 border-b border-slate-200">
              <div class="flex items-center gap-2">
                <button onclick="openHistoriModal()" class="text-slate-400 hover:text-lime-600 text-lg leading-none mr-1">←</button>
                <div>
                  <h3 class="text-slate-800 font-bold text-base">${label}</h3>
                  <p class="text-slate-400 text-xs mt-0.5">${txs.length} transaksi</p>
                </div>
              </div>
              <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">✕</button>
            </div>

            <!-- Ringkasan bulan -->
            <div class="grid grid-cols-3 gap-0 border-b border-slate-200">
              <div class="px-4 py-3 text-center border-r border-slate-200">
                <p class="text-xs text-slate-400 mb-1">Pemasukan</p>
                <p class="text-emerald-600 font-bold text-sm">${formatRp(totalIn)}</p>
              </div>
              <div class="px-4 py-3 text-center border-r border-slate-200">
                <p class="text-xs text-slate-400 mb-1">Pengeluaran</p>
                <p class="text-red-600 font-bold text-sm">${formatRp(totalOut)}</p>
              </div>
              <div class="px-4 py-3 text-center">
                <p class="text-xs text-slate-400 mb-1">Net</p>
                <p class="${net >= 0 ? 'text-emerald-600' : 'text-red-600'} font-bold text-sm">${net >= 0 ? '+' : ''}${formatRp(net)}</p>
              </div>
            </div>

            <!-- List transaksi -->
            <div class="p-4 overflow-y-auto max-h-[55vh] space-y-2">
              ${txRows}
            </div>
          </div>
        </div>`;
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() { document.getElementById('modal-container').innerHTML = ''; editingId = null; }

(function proteksiHalaman() {
  try {
    const raw = localStorage.getItem('hm_session');
    if (!raw) { window.location.replace('loginpage.html'); return; }
    const s = JSON.parse(raw);
    if (!s || !s.loginAt) { window.location.replace('loginpage.html'); return; }
    if (s.expiresAt && Date.now() > s.expiresAt) {
      localStorage.removeItem('hm_session');
      localStorage.removeItem('hm_komunitas');
      window.location.replace('loginpage.html'); return;
    }
  } catch(e) { window.location.replace('loginpage.html'); }
})();
